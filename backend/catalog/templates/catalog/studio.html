{% extends 'admin/base_site.html' %}{% block content %}<h1>סטודיו מוצרים</h1><form method='post' enctype='multipart/form-data'>{% csrf_token %}<input type='hidden' name='action' value='upload'><select name='subcategory' required>{% for s in subcategories %}<option value='{{ s.pk }}'>{{ s.category.name }} / {{ s.name }}</option>{% endfor %}</select><input type='file' name='files' multiple accept='image/*,video/*' required><button>העלאה</button></form>{% endblock %}
